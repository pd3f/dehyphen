[project]
name = "dehyphen"
version = "0.4.0"
description = "Dehyphenation of broken text (mainly German), i.e., extracted from a PDF"
license = "GPL-3.0-only"
authors = [{ name = "Johannes Filter", email = "hi@jfilter.de" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dehyphenation", "nlp", "german", "hyphens", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["clean-text[gpl]", "torch"]

[project.urls]
Repository = "https://github.com/pd3f/dehyphen"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
